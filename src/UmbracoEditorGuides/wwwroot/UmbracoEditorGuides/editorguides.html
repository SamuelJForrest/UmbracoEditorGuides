
<div ng-controller="Umbraco.EditorGuides as vm">
  <div class="editorguides-container">
    <uui-box ng-if="vm.viewState == vm.ViewStates.LIST">
      <div slot="headline">Guides <span ng-if="vm.FriendlyDocTypeName">({{ vm.FriendlyDocTypeName }})</span></div>
      <uui-button label="New Guide" look="primary" ng-click="vm.setViewState(vm.ViewStates.CREATE)" class="editorguides-btn--new"></uui-button>

      <div class="editorguides-list-container">
        <uui-table ng-if="vm.CurrentGuides.length > 0">
          <uui-table-head>
            <uui-table-head-cell>Title</uui-table-head-cell>
            <uui-table-head-cell>Description</uui-table-head-cell>
            <uui-table-head-cell>Actions</uui-table-head-cell>
          </uui-table-head>
          <uui-table-row ng-repeat="guide in vm.CurrentGuides">
            <uui-table-cell class="editorguides-cell--title">{{ guide.Title }}</uui-table-cell>
            <uui-table-cell class="editorguides-cell--description">{{ guide.Description }}</uui-table-cell>
            <uui-table-cell class="editorguides-cell--buttons">
              <uui-button-group>
                <uui-button look="primary" label="View" ng-click="vm.viewGuide(guide.Guid)"></uui-button>
                <uui-button look="secondary" label="Edit" ng-click="vm.editGuide(guide.Guid)"></uui-button>
                <uui-button look="primary" label="Delete" color="danger" ng-click="vm.showDeleteWarning(guide.Guid)"></uui-button>
              </uui-button-group>
            </uui-table-cell>
          </uui-table-row>
        </uui-table>

        <div ng-if="vm.CurrentGuides.length < 1">
          Nothing to see here... check back later.
        </div>
      </div>
    </uui-box>

    <uui-box headline="{{ vm.viewState == vm.ViewStates.CREATE ? 'New Guide' : 'Edit Guide' }}" ng-if="vm.viewState == vm.ViewStates.CREATE || vm.viewState == vm.ViewStates.EDIT">
      <form id="EditorGuidesForm" name="guideForm">
        <uui-input label="Guide Title" id="editorguides-title" placeholder="Guide title..." class="editorguides-input"></uui-input>
        <uui-input label="Guide Description" id="editorguides-description" placeholder="Description..." class="editorguides-input"></uui-input>
        <umb-property-editor id="editorguides-input" model="rteEditorGuides" class="editorguides-editor"></umb-property-editor>
        <div class="editorguides-editor-controls">
          <uui-button label="Cancel" look="primary" color="danger" ng-click="vm.clearGuide()"></uui-button>
          <uui-button label="Save" look="primary" type="submit" ng-click="vm.saveGuide()"></uui-button>
        </div>
      </form>
    </uui-box>

    <uui-box headline="{{ vm.CurrentGuide.Title }}" ng-if="vm.viewState == vm.ViewStates.VIEW">
      <div ng-bind-html="vm.CurrentGuide.Content"></div>

      <uui-button class="editorguides-btn--back" label="Back" look="primary" color="danger" ng-click="vm.setViewState(vm.ViewStates.LIST)"></uui-button>
    </uui-box>

    <uui-box headline="Delete '{{ vm.CurrentGuide.Title }}'?" ng-if="vm.viewState == vm.ViewStates.DELETE">
      <p>Are you sure you want to delete "<em><strong>{{ vm.CurrentGuide.Title }}</strong></em>"? This cannot be undone.</p>
      <div class="editorguides-controls--delete">
        <uui-button look="primary" label="Delete" color="danger" ng-click="vm.deleteGuide(vm.CurrentGuide.Guid)"></uui-button>
        <uui-button label="Go back" look="primary" ng-click="vm.setViewState(vm.ViewStates.LIST)"></uui-button>
      </div>
    </uui-box>
  </div>
</div>
